<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Badges - Mental Wellness App</title>
    <script src="js/theme-switcher.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="theme-toggle-container">
            <button id="themeToggleBtn" class="button-secondary" aria-label="Toggle theme">
                Toggle Theme
            </button>
        </div>
        <h1>Badges</h1>

        <section id="earnedBadgesSection">
            <h2>My Earned Badges</h2>
            <div id="earnedBadgesList" class="badges-grid">
                <!-- Earned badges will be loaded here -->
                <p>Loading your earned badges...</p>
            </div>
        </section>

        <section id="allBadgesSection" style="margin-top: 40px;">
            <h2>All Available Badges</h2>
            <div id="allBadgesList" class="badges-grid">
                <!-- All system badges will be loaded here -->
                <p>Loading all available badges...</p>
            </div>
        </section>

        <p style="margin-top: 30px;"><a href="dashboard.html">Back to Dashboard</a></p>
    </div>
    <script src="js/badges.js"></script>
</body>
</html>
