<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Mental Wellness App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Welcome!</h1>
        <p>You are successfully logged in.</p>

        <p><a href="copingbox.html">My Coping Box</a></p>
        <p><a href="journal.html">My Journal</a></p> <!-- Added this line -->

        <p style="margin-top: 20px;"><a href="login.html" id="logoutLink">Logout</a></p>
    </div>
    <script>
        // ... (existing script for logout and basic protection)
        const loggedInUser = sessionStorage.getItem('loggedInUser');
        // if (!loggedInUser && !sessionStorage.getItem('jwtToken')) { // More robust check
        //     window.location.href = 'login.html';
        // }

        const logoutLink = document.getElementById('logoutLink');
        if(logoutLink) {
            logoutLink.addEventListener('click', (e) => {
                e.preventDefault();
                sessionStorage.removeItem('loggedInUser');
                sessionStorage.removeItem('jwtToken');
                window.location.href = 'login.html';
            });
        }
    </script>
</body>
</html>
