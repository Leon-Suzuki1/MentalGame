<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Mental Wellness App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Welcome!</h1>
        <p>You are successfully logged in.</p>

        <!-- Link to Coping Box -->
        <p><a href="copingbox.html">My Coping Box</a></p>

        <p style="margin-top: 20px;"><a href="login.html" id="logoutLink">Logout</a></p>
    </div>
    <script>
        // Basic protection & logout
        const loggedInUser = sessionStorage.getItem('loggedInUser');
        if (!loggedInUser) {
            // In a real app, you'd also clear any stored tokens if redirecting.
            // window.location.href = 'login.html';
        }

        const logoutLink = document.getElementById('logoutLink');
        if(logoutLink) {
            logoutLink.addEventListener('click', (e) => {
                e.preventDefault();
                sessionStorage.removeItem('loggedInUser');
                sessionStorage.removeItem('jwtToken'); // Clear token on logout
                window.location.href = 'login.html';
            });
        }
    </script>
</body>
</html>
